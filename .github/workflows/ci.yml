name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Check formatting
        run: test -z "$(gofmt -l main.go)"

      - name: Run go vet
        run: go vet main.go

      - name: Run self-test
        run: SELF_TEST=1 go run main.go

      - name: Build
        run: go build -trimpath -o gitlab-feishu-relay main.go
